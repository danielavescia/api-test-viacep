name: Via Cep API Testing CI

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Rodar testes
        run: mvn clean test
      
      - name: Generate HTML report
        run: mvn surefire-report:report
        
      - name: Gerar Report Básico
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: target/site/